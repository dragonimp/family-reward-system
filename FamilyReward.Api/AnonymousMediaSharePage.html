<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive"><title>%%TITLE%% · Linko Moment</title><meta property="og:type" content="website"><meta property="og:title" content="%%TITLE%%"><meta property="og:description" content="打开活动相册，浏览照片与视频。无需登录，有效期内可访问。"><meta property="og:image" content="https://happylife.ai.impx.net/api/dear/public/brand/icon.png"><link rel="icon" href="/api/dear/public/brand/icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#233d32;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:1180px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;color:#65786b}.brand img{width:38px;height:38px;border-radius:11px}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(28px,4vw,46px);margin:28px 0 12px;overflow-wrap:anywhere}.description{white-space:pre-wrap;line-height:1.8;color:#6c7c70}.meta{font-size:12px;color:#839084;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e7ebe4}.card img,.card video{display:block;width:100%;height:260px;object-fit:cover;background:#e3e9e0}.card video{object-fit:contain;background:#16231d}.photo-button{display:block;border:0;padding:0;background:transparent;width:100%;cursor:zoom-in}.caption{padding:12px 14px;color:#5c705f;font-size:12px;overflow-wrap:anywhere}.caption p{margin:6px 0;line-height:1.6}button,a{color:#2b674b;font:inherit}button{cursor:pointer}a{text-underline-offset:3px}.state{text-align:center;padding:60px 20px;color:#728172}dialog{padding:0;border:0;background:#101813;color:white;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0}dialog::backdrop{background:#000}dialog img{width:100%;height:100%;object-fit:contain;touch-action:pinch-zoom}.close{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));border:0;border-radius:50%;background:#222a;color:white;width:44px;height:44px;font-size:24px}.footer{text-align:center;font-size:11px;color:#97a093;padding:36px}@media(max-width:520px){header,main{padding:20px 16px}.grid{grid-template-columns:1fr;gap:16px}.card img,.card video{height:auto;max-height:75vh;min-height:200px;object-fit:contain}}
</style></head><body><header><div class="brand"><img src="/api/dear/public/brand/icon.png" alt="Linko Moment 图标"><span>LINKO MOMENT · SHARED ALBUM</span></div><h1>%%TITLE%%</h1><div id="description" class="description"></div><div id="meta" class="meta"></div></header><main><div id="state" class="state">正在打开相册…</div><div id="grid" class="grid"></div></main><dialog id="viewer"><img id="large" alt="全屏照片"><button class="close" id="close" aria-label="关闭全屏">×</button></dialog><div class="footer">LINKO MOMENT · 一起留住这一刻</div><script nonce="%%NONCE%%">
const api='/api/dear/public/media-shares/%%TOKEN%%',grid=document.getElementById('grid'),state=document.getElementById('state'),viewer=document.getElementById('viewer'),large=document.getElementById('large');let signature='',expires=0;
function expired(){for(const video of grid.querySelectorAll('video')){video.pause();video.removeAttribute('src');video.load()}grid.replaceChildren();if(viewer.open)viewer.close();large.removeAttribute('src');state.textContent='链接已过期或已被撤销。';state.hidden=false}
function photo(item,thumb,original){const button=document.createElement('button');button.className='photo-button';button.setAttribute('aria-label','全屏查看照片');const image=document.createElement('img');image.loading='lazy';image.src=thumb;image.alt=item.originalFileName;button.append(image);button.onclick=()=>{large.src=item.originalAvailable&&/image\/(jpeg|png|webp)/.test(item.contentType)?original:thumb;large.onerror=()=>{large.onerror=null;large.src=thumb};viewer.showModal()};return button}
async function load(){try{const response=await fetch(api,{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});if(response.status===404){expired();return}if(!response.ok)throw Error();const data=await response.json();expires=Date.parse(data.expiresAt);if(expires<=Date.now()){expired();return}document.getElementById('description').textContent=data.description||'';document.getElementById('meta').textContent=data.media.length+' 项 · 有效期至 '+new Date(expires).toLocaleString();const next=JSON.stringify(data.media);if(next===signature)return;signature=next;grid.replaceChildren();state.hidden=data.media.length>0;state.textContent='活动里还没有可查看的照片或视频。';for(const item of data.media){const card=document.createElement('article');card.className='card';const root=api+'/media/'+encodeURIComponent(item.id),thumb=root+'/thumbnail',original=root+'/original';if(item.contentType.startsWith('video/')&&item.originalAvailable){const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';if(item.previewAvailable)video.poster=thumb;video.src=original;card.append(video)}else if(item.previewAvailable)card.append(photo(item,thumb,original));const caption=document.createElement('div');caption.className='caption';const name=document.createElement('p');name.textContent=item.originalFileName;caption.append(name);if(item.originalAvailable){const download=document.createElement('a');download.href=original;download.download=item.originalFileName;download.textContent='下载原文件';caption.append(download)}else{const note=document.createElement('p');note.textContent=item.contentType.startsWith('video/')?'原视频暂未缓存，等待共享设备上线后重试。':'当前可查看预览图，原文件暂未缓存。';caption.append(note)}card.append(caption);grid.append(card)}}catch{if(!signature)state.textContent='相册暂时无法打开，请检查网络后重试。'}}
document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});setInterval(()=>{if(expires&&Date.now()>=expires)expired();else load()},15000);load();
</script></body></html>
