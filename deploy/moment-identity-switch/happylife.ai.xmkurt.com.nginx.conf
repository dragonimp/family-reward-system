    # Inserted into the existing HTTPS server, retaining TLS and auth/API locations.
    root /var/www/happylife/frontend/static;
    index index.html;
    client_max_body_size 25m;
    location = /health {
        proxy_pass http://127.0.0.1:5102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /moment { return 308 /moment/; }
    location ^~ /moment/ { try_files $uri $uri/ /moment/index.html; }
    location / { try_files $uri $uri/ /index.html; }
