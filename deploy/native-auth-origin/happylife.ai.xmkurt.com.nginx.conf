# Former Moment origin: all user routes continue at the canonical site.
server {
    listen 443 ssl http2;
    server_name happylife.ai.xmkurt.com;
    ssl_certificate /etc/letsencrypt/live/happylife.ai.xmkurt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/happylife.ai.xmkurt.com/privkey.pem;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; default_type text/plain; }
    # Installed native clients validate the original authorization origin.
    # Their API/auth endpoints remain direct until they install the canonical-origin build.
    location ~ ^/(auth|api)/ {
        proxy_pass http://127.0.0.1:5102;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1860s;
    }
    location / { return 308 https://happylife.ai.impx.net$request_uri; }
}
server {
    listen 80;
    server_name happylife.ai.xmkurt.com;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; default_type text/plain; }
    location / { return 308 https://happylife.ai.impx.net$request_uri; }
}
