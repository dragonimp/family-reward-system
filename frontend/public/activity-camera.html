<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-title" content="活动拍照">
  <meta name="theme-color" content="#126b50">
  <link rel="apple-touch-icon" href="/moment-app-icon.png">
  <link rel="icon" href="/moment-app-icon.png">
  <title>活动拍照</title>
  <style>
    :root { color-scheme: light dark; font: 17px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(28rem, calc(100% - 3rem)); text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: .75rem 0 1.5rem; }
    a { display: inline-block; padding: .75rem 1.5rem; border-radius: .8rem; background: #126b50; color: white; text-decoration: none; font-weight: 650; }
    p { opacity: .78; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <img src="/moment-app-icon.png" alt="">
    <h1>活动拍照</h1>
    <a href="linkofamily://activity-camera">打开相机</a>
    <p>在 Safari 中点「分享」→「添加到主屏幕」，即可保留这个入口。</p>
  </main>
</body>
</html>
